name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: "2025.1.4"
            requirements: tests/requirements-ha-min.txt
            python: "3.13"
          - label: recent
            version: "2026.10.0"
            requirements: requirements-dev.txt
            python: "3.14"
    name: Home Assistant ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Verify the harness did not replace the selected Home Assistant
        env:
          EXPECTED_HA_VERSION: "${{ matrix.version }}"
        run: |
          python - <<'PY'
          import os
          from homeassistant.const import __version__
          assert __version__ == os.environ["EXPECTED_HA_VERSION"], __version__
          PY
      - run: python -m compileall -q custom_components tests
      - run: python -m ruff check .
      - run: pytest
      - run: python -m pip check

  latest-home-assistant:
    name: Latest Home Assistant import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install homeassistant
      - name: Import integration against Home Assistant
        run: |
          python - <<'PY'
          import custom_components.package_tracker
          import custom_components.package_tracker.config_flow
          import custom_components.package_tracker.coordinator
          import custom_components.package_tracker.diagnostics
          import custom_components.package_tracker.sensor
          print("Package Tracker Home Assistant imports passed")
          PY
      - run: python -m pip check
