name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q custom_components tests
      - run: python -m ruff check .
      - run: pytest

  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            requirement: homeassistant==2025.1.4
            python: "3.13"
          - label: current
            requirement: homeassistant
            python: "3.13"
    name: Home Assistant ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.requirement }}"
      - name: Import integration against Home Assistant
        run: |
          python - <<'PY'
          import custom_components.package_tracker
          import custom_components.package_tracker.config_flow
          import custom_components.package_tracker.coordinator
          import custom_components.package_tracker.diagnostics
          import custom_components.package_tracker.sensor
          print("Package Tracker Home Assistant imports passed")
          PY
      - run: python -m pip install pytest pytest-asyncio pytest-homeassistant-custom-component
      - run: pytest
      - run: python -m pip check
